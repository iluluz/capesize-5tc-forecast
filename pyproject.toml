[project]
name = "capesize"
version = "0.1.0"
description = "Capesize 5TC spot rate forecasting: ML part and text (DL) branch"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["data_pipeline"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
